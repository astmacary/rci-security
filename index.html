<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RCI Security</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#081C33" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RCI Security">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: single-column phone-first app shell — sticky header, stacked "cue cards", fixed bottom tab bar (mirrors the Power App's nav). */
:root{
  /* Brand: RCI navy #072442 and gold #BD9863 from the church logo */
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#E7EBF2; --line:#D3DAE5;
  --fg:#0B1D33; --muted:#566479; --accent:#8A6631; --accent-ink:#FFFFFF; --accent-soft:#F4EBDD;
  --ok:#1E7A4C; --ok-soft:#DDF1E6; --warn:#8A5A00; --warn-soft:#FBEBCD; --bad:#B3261E; --bad-soft:#F9DEDC;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
  --go:#1E8A52; --stop:#C62828; --blue:#0B3A6E;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#03111F; --surface:#081C33; --surface-2:#0E2845; --line:#1A3555;
  --fg:#EEF2F7; --muted:#A3B2C6; --accent:#D2B07C; --accent-ink:#03111F; --accent-soft:#252C38; --blue:#2B6CB0;
  --ok:#5CCB8F; --ok-soft:#0F2E2A; --warn:#E3B866; --warn-soft:#2E2A20; --bad:#F2877F; --bad-soft:#33202C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#03111F; --surface:#081C33; --surface-2:#0E2845; --line:#1A3555;
  --fg:#EEF2F7; --muted:#A3B2C6; --accent:#D2B07C; --accent-ink:#03111F; --accent-soft:#252C38; --blue:#2B6CB0;
  --ok:#5CCB8F; --ok-soft:#0F2E2A; --warn:#E3B866; --warn-soft:#2E2A20; --bad:#F2877F; --bad-soft:#33202C; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:16px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;background:none;border:none;padding:0;cursor:pointer;color:inherit}
.wm{height:48px;width:auto;max-width:100%;display:block;object-fit:contain;object-position:left center}
.wm-dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wm-light{display:none}:root:not([data-theme="light"]) .wm-dark{display:block}}
:root[data-theme="dark"] .wm-light{display:none}
:root[data-theme="dark"] .wm-dark{display:block}
.center-screen .wm{height:auto;width:min(280px,80%);object-position:center}
.install{display:flex;flex-direction:column;gap:8px}
.install p{margin:0;color:var(--muted);font-size:14px}
.install b{color:var(--fg)}
.brand b{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:none;border:1px solid var(--line);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn svg{width:18px;height:18px}

main{padding-bottom:calc(68px + env(safe-area-inset-bottom,0px))}
main .wrap{display:flex;flex-direction:column;gap:18px;padding-block:20px}

.demo{background:var(--accent-soft);color:var(--fg);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.demo strong{color:var(--accent)}

h1.greet{font-family:var(--display);font-weight:700;font-size:clamp(30px,8vw,40px);line-height:1.02;letter-spacing:.01em;text-wrap:balance;margin:0}
.sub{color:var(--muted);margin:4px 0 0}
.page-h{display:flex;align-items:center;gap:10px}
.page-h h1{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.02em;margin:0;text-wrap:balance}
.back{background:none;border:none;color:var(--muted);display:flex;align-items:center;gap:4px;padding:6px 8px 6px 0;font-weight:600}
.back svg{width:18px;height:18px}

.section-label{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.count{font-size:12px;font-weight:700;letter-spacing:0;background:var(--surface-2);color:var(--fg);border-radius:999px;padding:1px 8px}
.count.hot{background:var(--stop);color:#FFFFFF}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.announce p{margin:0}
.ann{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.ann li{padding-left:14px;position:relative;font-weight:500;display:flex;flex-direction:row;align-items:flex-start;gap:12px}
.ann li > span{flex:1;min-width:0}
.flyer{display:block;flex:none;width:clamp(96px,30%,150px);padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2);cursor:zoom-in}
.flyer img{display:block;width:100%;height:auto;max-height:200px;object-fit:cover;object-position:top;background:var(--surface-2)}
.flyer-load{display:block;padding:18px 6px;color:var(--muted);font-size:12px;font-weight:500;text-align:center}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;padding:calc(48px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.lb-close{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:26px;line-height:1}
.ann li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.bday-panel{display:flex;flex-direction:column;gap:12px;border-color:var(--accent)}
.bday-row{border-color:var(--accent)}
a.btn{text-decoration:none}
.email-addr{margin:0;font-size:13px;user-select:all;overflow-wrap:anywhere}
.msgs{gap:8px}
.msg{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.msg-body{min-width:0;flex:1}
.msg-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.msg-top span{color:var(--muted);font-size:12.5px;white-space:nowrap}
.msg p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.msg-del{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}
.linkbtn{background:none;border:none;padding:4px 0;margin-top:4px;color:var(--muted);font-size:13px;font-weight:600;text-decoration:underline}
.linkbtn.danger{color:var(--bad)}
.wall-form{margin-bottom:10px}
.wall-emoji{font-size:30px;width:52px;text-align:center;flex:none}
.bday-row .av{width:52px;height:52px}
.no-service{display:flex;align-items:center;gap:8px;background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad);border-radius:var(--r);padding:10px 14px;font-weight:700;margin-bottom:10px}
.bday-msg{margin:0;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;text-align:center}
.iconbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.date-chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:thin}
.date-chip{flex:none;display:flex;flex-direction:column;align-items:center;min-width:54px;padding:6px 4px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.date-chip b{font-size:20px;line-height:1.1;letter-spacing:0}
.date-chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.admin-row{display:flex;flex-direction:column;gap:6px;padding:10px 12px}
.admin-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.admin-who{display:flex;align-items:center;gap:10px;min-width:0}
.admin-title{display:flex;flex-direction:column;gap:1px;min-width:0}
.admin-title b{font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.admin-title .sub{font-size:13px}
.admin-side{display:flex;flex-direction:row;align-items:center;gap:6px;flex:none}
.admin-side .iconbtn{width:30px;height:30px}
.admin-side .iconbtn svg{width:15px;height:15px}
/* Edit Schedule rows: compact rectangles in one panel, like the Calendar roster */
.admin-lines{display:flex;flex-direction:column;padding:0;overflow:hidden;gap:0}
.admin-row.admin-line{border-top:1px solid var(--line);padding:8px 12px;gap:6px;min-width:0}
.admin-row.admin-line:first-child{border-top:none}
.line-main{display:flex;align-items:center;gap:8px;min-width:0}
.line-who{display:flex;align-items:center;gap:8px;flex:1 1 auto;min-width:0}
.line-who .av,.line-who .av.face{width:30px;height:30px;font-size:11px}
.line-name{display:flex;flex-direction:column;align-items:flex-start;min-width:0;gap:1px}
.line-name b{font-size:14.5px;line-height:1.2;max-width:100%;overflow:hidden;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.line-name .pill,.line-sub .pill{font-size:10px;padding:1px 6px}
.admin-line select{min-width:0;padding:4px 8px;min-height:32px;font-size:13px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px}
.line-main select{flex:0 1 140px;width:140px}
.line-btns{display:flex;gap:4px;flex:none}
.line-btns .iconbtn{width:28px;height:28px}
.line-btns .iconbtn svg{width:14px;height:14px}
.line-sub{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding-left:38px;align-items:end}
.line-sub label{display:flex;flex-direction:column;gap:2px;min-width:0}
.line-sub label > span{display:flex;flex-wrap:wrap;align-items:center;gap:3px 5px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.line-sub select{width:100%}
.admin-line.locked select{opacity:.55}
.admin-line.locked .line-who .av{opacity:.7}
.admin-line .del-ask{flex-direction:column;align-items:stretch;gap:6px;font-size:13px;background:var(--bad-soft);border-radius:8px;padding:8px}
.admin-line .del-ask .btn{justify-content:center;padding:6px 8px}
/* Larger for editing on phones */
.admin-row.admin-line{padding:12px 14px;gap:10px}
.line-main{gap:10px}
.line-who{gap:10px}
.line-who .av,.line-who .av.face{width:42px;height:42px;font-size:14px}
.line-name b{font-size:16.5px}
.line-name .pill,.line-sub .pill{font-size:11.5px;padding:2px 8px}
.admin-line select{padding:8px 10px;min-height:44px;font-size:15.5px}
.line-btns{gap:6px}
.line-btns .iconbtn{width:38px;height:38px}
.line-btns .iconbtn svg{width:18px;height:18px}
.line-sub label > span{font-size:12.5px}
.admin-line .del-ask{font-size:14.5px;padding:10px}
.admin-line .del-ask .btn{padding:9px 10px;font-size:15px}

/* Calendar roster: small photo left of each name */
.daylist .row{align-items:center}
.daylist .row .who{display:flex;align-items:center;gap:8px;min-width:0}
.daylist .row > span{align-self:center}
.daylist .row .av.mini{width:24px;height:24px;font-size:9.5px;color:var(--fg);text-align:center;margin:-2px 0}
/* Edit Schedule tiles (same layout as RCI Worship & Arts): several side by side */
.admin-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px}
.admin-row.admin-tile{padding:8px;gap:6px;min-width:0}
.tile-bar{display:flex;align-items:center;justify-content:space-between;gap:4px;min-width:0}
.tile-bar .pill{font-size:10.5px;padding:2px 7px;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tile-btns{display:flex;gap:4px;flex:none;margin-left:auto}
.tile-btns .iconbtn{width:28px;height:28px}
.tile-btns .iconbtn svg{width:14px;height:14px}
.tile-who{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;min-width:0}
.tile-who .av.face,.tile-who .av{width:52px;height:52px;font-size:16px}
.tile-name{font-size:14.5px;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile-sub{font-size:11.5px;color:var(--muted);line-height:1.2}
.tile-fields{display:flex;flex-direction:column;gap:5px}
.tile-f{display:flex;flex-direction:column;gap:2px;min-width:0}
.tile-f > span{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tile-f select{width:100%;min-width:0;padding:5px 8px;min-height:34px;font-size:13px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px}
.tile-f .field-tag{display:flex;justify-content:center;margin-top:3px}
.tile-f .hint{font-size:11px}
.admin-tile.locked select{opacity:.55}
.admin-tile.locked .tile-who .av{opacity:.7}
.admin-tile .del-ask{flex-direction:column;align-items:stretch;gap:6px;font-size:13px;background:var(--bad-soft);border-radius:8px;padding:8px}
.admin-tile .del-ask .btn{justify-content:center;padding:6px 8px}

.iconbtn.del-btn{color:var(--bad);border-color:var(--bad);background:transparent}
.del-ask{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--bad);font-weight:600;font-size:14px}
.del-ask .btn{padding:6px 12px}
.del-ask .yes{background:var(--bad);border-color:var(--bad);color:#FFFFFF}
.no-service .del-btn{margin-left:auto;width:30px;height:30px;flex:none}
.no-service .del-btn svg{width:15px;height:15px}
.ns-wrap{display:flex;flex-direction:column;gap:8px}
.admin-top .pill{flex:none}
.save-btn:disabled{opacity:.35;cursor:default}
.save-btn:not(:disabled){background:var(--accent);color:var(--accent-ink)}
.save-btn.busy{opacity:.6}
.admin-row.locked select{opacity:.55}
.admin-row.locked .av{opacity:.7}
.av.face{width:36px;height:36px;font-size:12px}
.inline-check{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--accent);background:transparent;color:var(--accent);vertical-align:-5px;box-sizing:border-box}
.inline-check svg{width:12px;height:12px}
ol.steps{margin:-6px 0 0;padding:12px 16px 12px 36px;display:flex;flex-direction:column;gap:4px}
ol.steps li{padding-left:2px}
.admin-grid{display:grid;grid-template-columns:1fr;gap:6px}
.admin-grid .field{gap:3px}
.admin-grid select{padding:7px 10px;min-height:38px;font-size:14px}
.admin-grid label{font-size:12.5px}
.linkbtn.edit-link{color:var(--ok)}
.ann-actions{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.ann-actions .msg-del{margin-top:0}
.ann li.ann-editing > span{color:var(--muted)}
.ann-meta{color:var(--muted);font-size:12.5px;font-weight:500}
.ann-form{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.announce .thanks{margin-top:8px;font-weight:600}
.empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:16px;text-align:center}

/* Cue card: one assignment */
.list{display:flex;flex-direction:column;gap:10px}
.cue{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:64px 1fr;overflow:hidden}
.cue.pending{border-color:var(--accent)}
.when{background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px;text-align:center}
.cue.pending .when{background:var(--accent);color:var(--accent-ink)}
.when .dow{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.when .day{font-family:var(--display);font-weight:700;font-size:30px;line-height:1}
.when .mon{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.cue-body{padding:12px 14px;min-width:0;display:flex;flex-direction:column;gap:6px}
.cue-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.role{font-weight:700;font-size:16.5px}
.cat{color:var(--muted);font-size:13.5px}
.times{display:flex;gap:2px 18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.times b{font-weight:600;color:var(--fg);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);background:transparent}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.accept{background:var(--go);border-color:var(--go);color:#FFFFFF}
.btn.decline{background:var(--stop);border-color:var(--stop);color:#FFFFFF}
.btn.decline-soft{color:var(--bad)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#FFFFFF}
.btn:disabled{opacity:.55;cursor:default}
.btn.block{width:100%;justify-content:center;padding:11px 14px}
.confirm-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}

.pill{font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.reply{background:var(--stop);color:#FFFFFF}
.pill.neutral{background:var(--surface-2);color:var(--muted)}

/* Calendar */
.cal-head{display:flex;align-items:center;gap:6px}
.cal-head h2{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.02em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dowh{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;padding:2px 0}
.dcell{height:44px;max-width:100%;border:none;background:transparent;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:14.5px;font-weight:500;color:var(--fg);padding:0}
.dcell.out{color:var(--muted);opacity:.45}
.dcell.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.dcell.sel{background:var(--accent);color:var(--accent-ink)}
.dots{display:flex;align-items:center;gap:3px;height:12px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}

.av{width:44px;height:44px;border-radius:50%;flex:none;background:var(--surface-2);color:var(--fg);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.03em;overflow:hidden;position:relative}

const onAppHost = !CONFIG.appHosts || CONFIG.appHosts.some(h => h.startsWith(".") ? location.hostname.endsWith(h) : location.hostname === h);

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); };
const spDate = v => v ? keyOf(new Date(v)) : "";              // SharePoint returns UTC instants for date-only columns
const toSp = k => k ? k + "T12:00:00Z" : null;        // local midnight → instant SharePoint stores as that date
const todayKey = () => keyOf(new Date());
const addDays = (k, n) => { const d = fromKey(k); d.setDate(d.getDate()+n); return keyOf(d); };
const fmtLong = k => fromKey(k).toLocaleDateString(undefined, {weekday:"long", month:"long", day:"numeric", year:"numeric"});
const fmtShort = k => fromKey(k).toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"});
const initials = n => (n||"?").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("");
const firstOf = n => (n||"").trim().split(/\s+/)[0] || "";
const lc = s => (s||"").toLowerCase();

const ICON = {
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',

let toastTimer;
function toast(msg, bad=false){
  const t = $("#toast"); t.textContent = msg; t.className = "toast" + (bad ? " bad" : ""); t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ t.hidden = true; }, bad ? 6000 : 3200);
}

/* ---------- theme toggle (the original app's dark-mode switch) ---------- */
function currentDark(){
  const t = document.documentElement.getAttribute("data-theme");
  if (t) return t === "dark";
  return matchMedia("(prefers-color-scheme: dark)").matches;
}
function toggleTheme(){
  const next = currentDark() ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("rci-sec-theme", next); } catch(e){}
  render();
}
try { const saved = localStorage.getItem("rci-sec-theme"); if (saved) document.documentElement.setAttribute("data-theme", saved); } catch(e){}

/* ============================================================
   DATA LAYER — Graph (live) or in-memory sample (demo)
   ============================================================ */
/* One Security Schedule row. Columns: ServiceDate, Name (person → email), SecurityName,
   Placement, Status, ServiceCategory, CallTime. */
/* Roster rows (the "Roster" view) have no Service Date, Service Category or Call Time; they hold each
   person's profile: Security Name, Name (email), Phone Number, Birthday, Photo. */
function normalize(id, f, emailById){
  const roster = !f.ServiceDate && !f.ServiceCategory && !f.CallTime;
  return {
    id: String(id),
    role: f.Placement || "",
    date: f.ServiceDate ? spDate(f.ServiceDate) : "",
    category: roster ? CONFIG.profileCategory : (f.ServiceCategory || ""),
    call: f.CallTime || "",
    svcTime: "",
    fullName: f.SecurityName || "",
    email: lc(emailById ? emailById[f.NameLookupId] : f.email),
    personId: f.NameLookupId != null ? String(f.NameLookupId) : "",
    status: f.Status || "",
    published: "", notes: "", first: "", timeOff: "", serving: [],
    birthday: f.Birthday ? (/^\d{4}-\d{2}-\d{2}$/.test(f.Birthday) ? f.Birthday : spDate(f.Birthday)) : "",
    phone: f.PhoneNumber || "",
    photoRaw: typeof f.Photo === "string" ? f.Photo : (f.Photo ? JSON.stringify(f.Photo) : ""),
    editable: roster,
    archived: lc(f.ArchiveStatus) === "archive"
  };
}
/* Anyone on the schedule without a Roster row still gets a (read-only) directory entry from their schedule rows. */
function buildPeople(rows){
  const by = new Map();
  const have = new Set(rows.filter(isProfile).map(r => r.email || lc(r.fullName)));
  rows.filter(r => r.date).sort((a,b) => a.date.localeCompare(b.date)).forEach(r => {
    const key = r.email || lc(r.fullName); if (!key || have.has(key)) return;
    const p = by.get(key) || { id: "p-" + key, category: CONFIG.profileCategory, role: "", date: "", status: "", email: r.email,
      fullName: "", first: "", birthday: "", phone: "", photoRaw: "", serving: [], notes: "", timeOff: "" };
    if (r.fullName && r.fullName.trim() !== "--") p.fullName = r.fullName.trim();
    by.set(key, p);
  });
  return [...by.values()].filter(p => p.fullName);
}

/* The Announcements column can hold several lines; SharePoint may return it as plain text or simple HTML. */
function annText(v){
  if (!v) return "";
  if (!/<[a-z][\s\S]*>/i.test(v)) return v.trim();
  const d = new DOMParser().parseFromString(v.replace(/<br\s*\/?>/gi, "\n").replace(/<\/(p|div|li)>/gi, "\n"), "text/html");
  return (d.body.textContent || "").replace(/\n{3,}/g, "\n\n").trim();
}
const annOneLine = t => t.replace(/\s*\n+\s*/g, " ").slice(0, 255);
/* First line as a bold headline, the rest underneath with its line breaks. */
function annHtml(t){
  const lines = String(t || "").split(/\n/).map(l => l.trim()).filter(Boolean);
  const head = lines.shift() || "", rest = lines.join("\n");
  return `<b class="ann-title">${esc(head)}</b>${rest ? `<span class="ann-text">${esc(rest)}</span>` : ""}`;
}

  return `<div class="field" id="ann-flyer-box"><label>Flyer <span class="hint">(optional image; tap it on Home to see it full screen)</span></label>${status}

function birthdaysToday(){

  return S.items.filter(i => isProfile(i) && i.birthday && (i.birthday.slice(5) === md || (!leap && md === "02-28" && i.birthday.slice(5) === "02-29")))

/* Confetti: phones only, once per day per device, skipped for reduced motion. */
function maybeConfetti(){
  if (!birthdaysToday().length) return;
  if (!matchMedia("(pointer: coarse)").matches && innerWidth > 820) return;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const key = "rci-sec-confetti-" + todayKey();
  try { if (localStorage.getItem(key)) return; localStorage.setItem(key, "1"); } catch(e){}
  const c = document.createElement("canvas");
  c.setAttribute("aria-hidden", "true");
  c.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50";
  document.body.appendChild(c);
  const ctx = c.getContext("2d"), dpr = Math.min(devicePixelRatio || 1, 2);
  const W = c.width = innerWidth * dpr, H = c.height = innerHeight * dpr;
  const colors = ["#D2B07C", "#BD9863", "#072442", "#FFFFFF", "#1E8A52", "#C62828", "#4A90D9"];
  const bits = Array.from({ length: 160 }, () => ({
    x: W/2 + (Math.random() - .5) * W * .3, y: H * .35,
    vx: (Math.random() - .5) * 16 * dpr, vy: (-Math.random() * 18 - 6) * dpr,
    w: (6 + Math.random() * 6) * dpr, h: (8 + Math.random() * 8) * dpr,
    r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3, col: colors[Math.floor(Math.random() * colors.length)]
  }));
  const start = performance.now();
  (function frame(now){
    const age = now - start;
    ctx.clearRect(0, 0, W, H);
    bits.forEach(b => {
      b.vy += .45 * dpr; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.r += b.vr;
      ctx.save(); ctx.globalAlpha = Math.max(0, 1 - Math.max(0, age - 2600) / 900);
      ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.fillStyle = b.col;
      ctx.fillRect(-b.w/2, -b.h/2, b.w, b.h * Math.abs(Math.cos(b.r * 2)) + 2); ctx.restore();
    });
    if (age < 3500) requestAnimationFrame(frame); else c.remove();
  })(start);
}

/* Birthday wall: open from the person's birthday through CONFIG.wallDays days after; messages show for CONFIG.wallDays days. */
function lastBirthday(p){
  if (!p || !p.birthday) return null;
  const t = todayKey(), y = Number(t.slice(0,4)), md = p.birthday.slice(5);
  const occ = yr => { const leap = (yr % 4 === 0 && yr % 100 !== 0) || yr % 400 === 0; return `${yr}-${md === "02-29" && !leap ? "02-28" : md}`; };
  const k = occ(y);
  return k <= t ? k : occ(y - 1);
}
function wallOpen(p){ const b = lastBirthday(p); return !!b && addDays(b, CONFIG.wallDays) >= todayKey(); }
function wallMessages(p){

function ago(iso){
  const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1) return "just now"; if (mins < 60) return `${mins} min ago`;
  const h = Math.round(mins / 60); if (h < 24) return `${h} hr ago`;
  return new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

/* Rich-text notes from SharePoint: keep structure, drop scripts, styles and attributes. */
const KEEP = new Set(["P","DIV","BR","B","STRONG","I","EM","U","UL","OL","LI","H1","H2","H3","H4","TABLE","THEAD","TBODY","TR","TD","TH","SPAN","A","HR","BLOCKQUOTE"]);
function cleanHtml(raw){
  const doc = new DOMParser().parseFromString(`<div>${raw}</div>`, "text/html");
  const walk = node => {
    [...node.childNodes].forEach(n => {
      if (n.nodeType === 3) return;
      if (n.nodeType !== 1 || /^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|NOSCRIPT|TEMPLATE)$/.test(n.tagName)){ n.remove(); return; }
      walk(n);
      if (!KEEP.has(n.tagName)){ n.replaceWith(...n.childNodes); return; }
      const href = n.tagName === "A" ? n.getAttribute("href") : null;
      [...n.attributes].forEach(a => n.removeAttribute(a.name));
      if (href && /^https?:\/\//i.test(href)){ n.setAttribute("href", href); n.setAttribute("target","_blank"); n.setAttribute("rel","noopener"); }
    });
  };
  const root = doc.body.firstChild; walk(root);
  return root.innerHTML;
}

const isNoService = i => lc(i.category || "") === lc(CONFIG.noServiceCategory);

/* Add Positions: one row per Security Name in the Roster that isn't on the date yet.

const rosterPeople = () => S.items.filter(p => isProfile(p) && p.editable && !p.archived).sort((a, b) => Number(a.id) - Number(b.id));
function templateMissing(rows){
  const have = rows.filter(i => !isNoService(i));
  return rosterPeople().filter(p => !have.some(i => (p.email && i.email === p.email) || (p.fullName && lc(i.fullName) === lc(p.fullName))));

function mostCommon(vals){ const n = {}; vals.forEach(v => { n[v] = (n[v] || 0) + 1; }); return Object.keys(n).sort((a, b) => n[b] - n[a])[0] || ""; }
const templateCategory = rows => mostCommon(rows.filter(i => !isNoService(i) && svcFilled(i.category) && !NOT_A_SERVICE.includes(i.category)).map(i => i.category));
const templateCallTime = rows => mostCommon(rows.filter(i => !isNoService(i) && i.call).map(i => i.call));

  if (S.tplAsk === k){
    const cat = templateCategory(rows), list = serviceChoices(); if (cat && !list.includes(cat)) list.unshift(cat);
    return `<div class="tpl-ask"><span>Add ${what} to ${esc(fmtShort(k))}?</span>

const TABS = [["home","Home",ICON.home],["calendar","Calendar",ICON.cal],["directory","Team",ICON.team],["profile","Profile",ICON.user]];

function render(){
  const app = $("#app");
  const themeBtn = `<button class="iconbtn" data-act="theme" aria-label="Switch to ${currentDark()?"light":"dark"} mode">${currentDark()?ICON.sun:ICON.moon}</button>`;

    if (S.phase === "signin") body = `<div class="center-screen"><img class="wm wm-light" src="icons/wordmark.png?v=${APP_VERSION}" alt="RCI Security"><img class="wm wm-dark" src="icons/wordmark-dark.png?v=${APP_VERSION}" alt="RCI Security"><p>Sign in with your church Microsoft account to see your schedule, reply to requests and update your profile.</p><button class="btn primary" data-act="signin">Sign in with Microsoft</button></div>`;
    if (S.phase === "error") body = `<div class="center-screen"><h1>Can't reach the schedule</h1><p>The app couldn't load the Security Schedule list. Check that you're a member of the RCI Security SharePoint site, then try again.</p><div class="err">${esc(S.error)}</div><button class="btn primary" data-act="retry">Try again</button></div>`;
    app.innerHTML = header + `<main><div class="wrap">${body}</div></main>`;
    return;
  }
  const views = { admin: viewAdmin, directory: viewDirectory, home: viewHome, schedule: viewSchedule, calendar: viewCalendar, team: viewTeam, member: viewMember, absence: viewAbsence, profile: viewProfile };
  if (!views[S.view]){ S.view = "home"; S.arg = null; }
  saveNav();

  const demoBar = DEMO ? `<div class="demo"><span><strong>Demo mode.</strong> Sample people and dates; nothing is saved to SharePoint. Open it from the app's official link to connect the Security Schedule list.</span></div>` : "";

/* Remember the page being viewed, so reloading the app (pull to refresh, the browser's reload, an update)
   comes back to the same page instead of Home. Kept for this tab/app window only. */
const NAV_KEY = "rci-nav:" + location.pathname;
const NAV_SKIP = { doc: "docs" };   // pages that can't be rebuilt on their own go to their parent
function saveNav(){
  try { sessionStorage.setItem(NAV_KEY, JSON.stringify({ view: S.view, arg: S.arg, stack: S.stack.slice(-10),
    adminDate: S.adminDate || null, adminExtra: S.adminExtra || null, calSel: S.cal.sel, calMonth: S.cal.month ? keyOf(S.cal.month) : null })); } catch(_){}
}
function restoreNav(){
  try {
    const n = JSON.parse(sessionStorage.getItem(NAV_KEY) || "null"); if (!n || !n.view) return;
    S.view = NAV_SKIP[n.view] || n.view; S.arg = NAV_SKIP[n.view] ? null : n.arg; S.stack = Array.isArray(n.stack) ? n.stack : [];
    if (n.adminDate) S.adminDate = n.adminDate; if (n.adminExtra) S.adminExtra = n.adminExtra;
    if (n.calSel) S.cal.sel = n.calSel; if (n.calMonth) S.cal.month = fromKey(n.calMonth);
  } catch(_){}
}
function go(view, arg=null, push=true){
  if (push) S.stack.push({ view: S.view, arg: S.arg });
  S.view = view; S.arg = arg; S.confirm = null; render(); window.scrollTo(0,0);
}

async function setStatus(item, accept){
  S.busy.add(item.id); render();
  const fields = { Status: accept ? "Accepted" : "Declined" };
  try {
    await API.update(item.id, fields);
    item.status = fields.Status;
    toast(accept ? `Accepted: ${item.role}, ${fmtShort(item.date)}` : `Declined: ${item.role}, ${fmtShort(item.date)}`);
  } catch(e){ toast("Couldn't save your reply. " + e.message, true); }
  S.busy.delete(item.id); S.confirm = null; render(); updateBadge();
}

async function resizeImage(file, maxSide){
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const max = maxSide || 600, s = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, "image/jpeg", 0.86));
}

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, item = S.items.find(i => i.id === b.dataset.id);
  switch(act){
    case "tab": S.annEdit = false; S.annEditId = null; S.stack = []; S.absenceDone = false; go(b.dataset.view, null, false); break;
    case "back": { const prev = S.stack.pop() || { view: "home" }; go(prev.view, prev.arg, false); break; }
    case "theme": toggleTheme(); break;
    case "accept": setStatus(item, true); break;
    case "ask-decline": S.confirm = item.id; render(); break;
    case "decline": setStatus(item, false); break;
    case "cancel": S.confirm = null; render(); break;
    case "team": go("team", b.dataset.date); break;
    case "member": go("member", b.dataset.id); break;
    case "member-of": { const p = profileOf(item); go("member", p ? p.id : null); break; }
    case "pick": S.cal.sel = b.dataset.date; { const d = fromKey(S.cal.sel); if (d.getMonth() !== S.cal.month.getMonth()) S.cal.month = new Date(d.getFullYear(), d.getMonth(), 1); } render(); break;
    case "cal-prev": S.cal.month = new Date(S.cal.month.getFullYear(), S.cal.month.getMonth()-1, 1); render(); break;
    case "cal-next": S.cal.month = new Date(S.cal.month.getFullYear(), S.cal.month.getMonth()+1, 1); render(); break;
    case "cal-today": { const t = new Date(); S.cal.month = new Date(t.getFullYear(), t.getMonth(), 1); S.cal.sel = todayKey(); render(); break; }
    case "copy": try { await navigator.clipboard.writeText(b.dataset.text); toast("Phone number copied"); } catch(err){ toast("Select the number to copy it", true); } break;
    case "badge-on": try { const r = await Notification.requestPermission(); if (r === "granted"){ updateBadge(); toast("App badge turned on"); } } catch(err){} render(); break;
    case "wall": go("member", b.dataset.id); requestAnimationFrame(() => { const w = document.getElementById("wall"); if (w) w.scrollIntoView({ block: "start", behavior: "smooth" }); }); break;
    case "msg-ask": S.confirmMsg = b.dataset.id; render(); break;
    case "admin-open": if (b.dataset.date){ S.adminDate = b.dataset.date; S.adminExtra = b.dataset.date; } S.catEdit = null; S.noSvcAsk = null; S.pickOpen = false; go("admin"); break;
    case "admin-pick-open": {
      S.pickOpen = !S.pickOpen; render();
      const f = $("#admin-pick"); if (f){ f.focus(); try { f.showPicker(); } catch(_){} }
      break;
    }
    case "cat-edit": S.catEdit = b.dataset.date; render(); { const f = $("#cat-pick"); if (f){ f.focus(); try { f.showPicker(); } catch(_){} } } break;
    case "cat-cancel": S.catEdit = null; render(); break;
    case "no-service": S.noSvcAsk = b.dataset.date; render(); break;
    case "no-service-keep": S.noSvcAsk = null; render(); break;
    case "no-service-yes": {
      if (!isEditor() || S.noSvcBusy) break;
      const k = b.dataset.date; S.noSvcBusy = true; render();
      try {
        const id = await API.addRow(k, CONFIG.noServiceCategory);
        const it = normalize(id, { ServiceCategory: CONFIG.noServiceCategory }); it.date = k; it.archived = false;
        S.items.push(it); S.noSvcAsk = null; toast(`${fmtShort(k)} marked as No Service`);
      } catch(err){ toast("Couldn't mark it. " + err.message, true); }
      S.noSvcBusy = false; render(); break;
    }
    case "tpl": S.tplAsk = b.dataset.date; render(); break;
    case "tpl-keep": S.tplAsk = null; render(); break;
    case "tpl-yes": {
      if (!isEditor() || S.tplBusy) break;
      const k = b.dataset.date, cat = ($("#tpl-cat")?.value || "").trim();
      if (!cat){ toast("Choose a Service Category first.", true); break; }
      const rows = S.items.filter(i => !isProfile(i) && i.date === k && !i.archived);
      const miss = templateMissing(rows), call = templateCallTime(rows);
      let added = 0;
      try {
        for (const p of miss){   // one at a time, so the rows keep the Roster's order in SharePoint
          S.tplBusy = `${added + 1} of ${miss.length}`; render();
          const extra = { SecurityName: p.fullName, Placement: "--", Status: "Pending", ArchiveStatus: "Active" };
          if (p.personId) extra.NameLookupId = String(p.personId);
          if (call) extra.CallTime = call;
          const id = await API.addRow(k, cat, extra);
          const it = normalize(id, { ...extra, ServiceCategory: cat, email: p.email }); it.date = k; it.archived = false;
          it.email = p.email; it.personId = p.personId || "";
          S.items.push(it); added++;
        }
        S.tplAsk = null; toast(`Added ${added} Security Name${added === 1 ? "" : "s"} to ${fmtShort(k)}`);
      } catch(err){ toast(`Added ${added} of ${miss.length}. ` + err.message, true); }
      S.tplBusy = null; render(); break;
    }
    case "admin-date": S.tplAsk = null; S.delAsk = null; S.catEdit = null; S.noSvcAsk = null; S.pickOpen = false; S.adminDate = b.dataset.date; render(); document.querySelector(`[data-act="admin-date"][data-date="${S.adminDate}"]`)?.scrollIntoView({ inline: "center", block: "nearest" }); break;
    case "del-ask": S.delAsk = b.dataset.id; render(); break;
    case "del-keep": S.delAsk = null; render(); break;
    case "del-yes": {
      if (!isEditor() || S.delBusy) break;
      const ids = (b.dataset.ids || "").split(",").filter(Boolean), done = b.dataset.done;
      S.delBusy = true; render();
      try {
        for (const id of ids){ await API.deleteItem(id); S.items = S.items.filter(i => i.id !== id); }
        S.delAsk = null; toast(done || "Deleted");
      } catch(err){ toast("Couldn't delete it. " + err.message, true); }
      S.delBusy = false; render(); break;
    }
    case "admin-unlock": {
      const row = b.closest(".admin-row");
      (S.adminUnlocked = S.adminUnlocked || new Set()).add(b.dataset.id);
      row.classList.remove("locked");
      row.querySelectorAll("select").forEach(x => x.disabled = false);
      b.outerHTML = saveIcon();
      row.querySelector("select")?.focus(); break;
    }
    case "ann-flyer-clear": if (S.annFlyer){ S.annFlyer.file = null; S.annFlyer.preview = ""; } annFlyerRefresh(); break;
    case "ann-flyer-drop": if (S.annFlyer) S.annFlyer.remove = true; annFlyerRefresh(); break;
    case "ann-flyer-keep": if (S.annFlyer) S.annFlyer.remove = false; annFlyerRefresh(); break;
    case "ann-edit": if (canEditAnns()){ S.annEdit = !S.annEdit; S.confirmAnn = null; S.annEditId = null; render(); } break;
    case "ann-change": if (canEditAnns()){ S.annEditId = Number(b.dataset.id); S.confirmAnn = null; render(); $("#annForm")?.scrollIntoView({ block: "center", behavior: "smooth" }); $("#ann-text")?.focus({ preventScroll: true }); } break;
    case "ann-change-cancel": S.annEditId = null; render(); break;
    case "ann-ask": S.confirmAnn = Number(b.dataset.id); render(); break;
    case "ann-keep": S.confirmAnn = null; render(); break;
    case "ann-delete": {
      if (!canEditAnns()) break;
      const id = Number(b.dataset.id); b.disabled = true;
      try { await API.deleteAnnouncement(id); S.announcements = S.announcements.filter(a => a.id !== id); toast("Announcement removed"); }
      catch(err){ toast("Couldn't remove it. " + err.message, true); }
      S.confirmAnn = null; render(); break;
    }
    case "msg-keep": S.confirmMsg = null; render(); break;
    case "msg-delete": {
      const id = b.dataset.id; b.disabled = true;
      try { await API.deleteMessage(id); S.messages = S.messages.filter(m => m.id !== id); toast("Message deleted"); }
      catch(err){ toast("Couldn't delete the message. " + err.message, true); }
      S.confirmMsg = null; render(); break;
    }
    case "flyer-open": if (b.dataset.url) openLightbox(b.dataset.url, b.querySelector("img")?.alt); break;
    case "serve-toggle": b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true"); break;
    case "absence-again": S.absenceDone = false; S.abs = null; render(); break;
    case "abs-pick": { const A = absState(), k = b.dataset.date; A.sel.has(k) ? A.sel.delete(k) : A.sel.add(k); render(); break; }
    case "abs-prev": { const A = absState(); A.month = new Date(A.month.getFullYear(), A.month.getMonth()-1, 1); render(); break; }
    case "abs-next": { const A = absState(); A.month = new Date(A.month.getFullYear(), A.month.getMonth()+1, 1); render(); break; }
    case "signin": API.signIn(); break;
    case "signout": API.signOut(); break;
    case "retry": start(); break;
    case "install": if (deferredInstall){ deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; render(); } break;
  }
});

document.addEventListener("submit", async e => {
  e.preventDefault();
  if (e.target.id === "catForm"){
    if (!isEditor()) return;
    const k = e.target.dataset.date, v = $("#cat-pick").value.trim().replace(/\s+/g, " "); if (!v) return;
    const list = S.items.filter(i => !isProfile(i) && i.date === k && !isNoService(i) && i.category !== v);
    const btn = e.target.querySelector('button[type="submit"]'); btn.disabled = true; btn.classList.add("busy");
    try {
      for (let n = 0; n < list.length; n += 6)   // a few rows at a time
        await Promise.all(list.slice(n, n + 6).map(async i => { await API.update(i.id, { ServiceCategory: v }); i.category = v; }));
      S.catEdit = null; toast(`${fmtShort(k)}: ${v}`); render();
    } catch(err){ toast("Couldn't change it. " + err.message, true); btn.disabled = false; btn.classList.remove("busy"); render(); }
    return;
  }
  const p = myProfile();
  if (e.target.id === "absenceForm" && p){
    const A = absState(), dates = [...A.sel].sort(), notes = $("#ab-notes").value.trim();
    if (!dates.length){ toast("Tap the days you'll be away on the calendar.", true); return; }
    const btn = $("#ab-submit"); btn.disabled = true; btn.textContent = "Submitting…";
    // Time Off Date holds the first day; every day (and any note) goes in Notes for the schedule team.
    const html = `<p><strong>Dates of Absence:</strong> ${dates.map(k => esc(fmtShort(k))).join("; ")}</p>` + (notes ? `<p>${esc(notes).replace(/\n/g,"<br>")}</p>` : "");
    try {
      await API.update(p.id, { TimeOffDate: toSp(dates[0]), Notes: html });
      p.timeOff = dates[0]; p.notes = html; A.sent = dates; A.notes = ""; S.absenceDone = true; render();
    } catch(err){ toast("Couldn't submit your absence. " + err.message, true); btn.disabled = false; btn.textContent = "Submit Absence"; }
  }
  if (e.target.classList.contains("admin-row")){
    if (!isEditor()) return;
    const item = S.items.find(i => i.id === e.target.dataset.id); if (!item) return;
    const placement = e.target.querySelector('[data-f="Placement"]').value;
    const btn = e.target.querySelector('button[type="submit"]');
    if (placement === item.role){ btn.disabled = true; return; }
    // Like the Productions app: a changed placement goes back to Pending, so the person confirms again.
    const fields = { Placement: placement || null };
    if (lc(item.status) !== "pending") fields.Status = "Pending";
    btn.disabled = true; btn.classList.add("busy");
    try {
      await API.update(item.id, fields);
      item.role = placement; item.status = "Pending";
      S.adminUnlocked?.delete(item.id);
      toast(`Saved: ${item.fullName}, ${placement || "no placement"}, ${fmtShort(item.date)}`); render(); updateBadge();
    } catch(err){ toast("Couldn't save the change. " + err.message, true); btn.disabled = false; btn.classList.remove("busy"); }
    return;
  }
  if (e.target.id === "annForm"){
    if (!canEditAnns()) return;
    const text = $("#ann-text").value.trim(), until = $("#ann-until").value;
    if (!text) return;
    const editId = e.target.dataset.id ? Number(e.target.dataset.id) : null;
    const btn = $("#ann-add"); btn.disabled = true; btn.textContent = editId != null ? "Saving…" : "Adding…";
    if (editId != null){
      try {
        const fd = S.annFlyer || {}; const flyer = fd.file ? await resizeImage(fd.file, 1600) : null;
        const patch = await API.updateAnnouncement(editId, text, until, flyer, !!fd.remove);
        const a = S.announcements.find(x => x.id === editId); if (a){ a.text = text; a.until = until || ""; Object.assign(a, patch || {}); }
        S.annFlyer = null;
        S.annEdit = false; S.annEditId = null; S.confirmAnn = null; toast("Announcement updated"); render();
      } catch(err){ toast("Couldn't save it. " + err.message, true); btn.disabled = false; btn.textContent = "Save Changes"; }
      return;
    }
    try { const fd = S.annFlyer || {}; const flyer = fd.file ? await resizeImage(fd.file, 1600) : null;
      const a = await API.addAnnouncement(text, until, flyer); S.announcements = [...(S.announcements || []), a]; S.annFlyer = null; S.annEdit = false; S.confirmAnn = null; toast("Announcement added"); render(); }
    catch(err){ toast("Couldn't add it. " + err.message, true); btn.disabled = false; btn.textContent = "Add Announcement"; }
    return;
  }
  if (e.target.id === "wallForm"){
    const to = S.items.find(i => i.id === e.target.dataset.id), text = $("#wall-text").value.trim();
    if (!to || !text) return;
    const btn = $("#wall-send"); btn.disabled = true; btn.textContent = "Posting…";
    try { const m = await API.postMessage(to, text); S.messages = [m, ...(S.messages || [])]; toast("Birthday message posted 🎉"); render(); }
    catch(err){ toast("Couldn't post your message. " + err.message, true); btn.disabled = false; btn.textContent = "Post Message"; }
    return;
  }
  if (e.target.id === "personForm"){
    const who = S.items.find(i => i.id === e.target.dataset.id); if (!who || !who.editable) return;
    const f = { Birthday: toSp($("#pf-bday").value), PhoneNumber: $("#pf-phone").value.trim() };
    const btn = $("#pf-save"); btn.disabled = true; btn.textContent = "Saving…";
    try {
      await API.update(who.id, f);
      Object.assign(who, { birthday: $("#pf-bday").value, phone: f.PhoneNumber });
      toast("Saved"); render();
    } catch(err){ toast("Couldn't save. " + err.message, true); btn.disabled = false; btn.textContent = "Save"; }
  }
});

document.addEventListener("input", e => {
  if (e.target.id === "cat-pick"){ const f = e.target.form, v = e.target.value.trim(); f.querySelector(".save-btn").disabled = !v || v === f.dataset.cur; return; } if (e.target.id === "ab-notes") absState().notes = e.target.value; });

document.addEventListener("change", async e => {
  if (e.target.id === "ann-flyer"){
    const f = e.target.files[0]; if (!f) return;
    S.annFlyer = S.annFlyer || {}; S.annFlyer.file = f; S.annFlyer.preview = URL.createObjectURL(f); S.annFlyer.remove = false;
    annFlyerRefresh(); return;
  }
  if (e.target.id === "admin-pick"){ if (e.target.value){ S.adminExtra = e.target.value; S.adminDate = e.target.value; S.catEdit = null; S.noSvcAsk = null; S.pickOpen = false; render(); } return; }
  const adRow = e.target.closest(".admin-row");
  if (adRow){ adRow.querySelector('button[type="submit"]').disabled = false; return; }
  if (e.target.id !== "pf-photo" || !e.target.files[0]) return;
  const p = S.items.find(i => i.id === e.target.dataset.id); if (!p || !p.editable) return;
  toast("Uploading photo…");
  try {
    const blob = await resizeImage(e.target.files[0]);
    const raw = await API.uploadPhoto(p, blob);
    p.photoRaw = raw;
    if (DEMO) S.demoPhotos[p.id] = JSON.parse(raw).demo; else LiveAPI.cache.clear();
    toast("Photo updated"); render();
  } catch(err){ toast("Couldn't update your photo. " + err.message, true); }
});

/* ============================================================
   START
   ============================================================ */
async function start(){
  S.phase = "boot"; render();
  try {
    const signedIn = await API.init();
    if (!signedIn){ S.phase = "signin"; render(); return; }
    const data = await API.load();
    S.me = data.me; S.items = data.items; S.names = data.names; S.servingChoices = data.servingChoices || []; S.placements = data.placements || []; S.announcements = data.announcements || []; S.messages = data.messages || [];
    const t = new Date(); S.cal.month = new Date(t.getFullYear(), t.getMonth(), 1); S.cal.sel = todayKey();
    restoreNav();
    S.phase = "ready"; render(); maybeConfetti(); updateBadge();
  } catch(e){
    console.error(e); S.error = e.message || String(e); S.phase = "error"; render();
  }
}
start();

/* When someone comes back to an app that's already open, check for a newer version and refresh to it,
   unless they're in the middle of editing something. */
let lastVersionCheck = 0;
async function checkForUpdate(){
  if (DEMO || Date.now() - lastVersionCheck < 30000) return;
  lastVersionCheck = Date.now();
  try {
    const text = await fetch("index.html?v=" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.text() : "");
    const live = (text.match(/APP_VERSION = "([^"]+)"/) || [])[1];
    if (!live || live === APP_VERSION) return;
    const busy = S.annEdit || (S.adminUnlocked && S.adminUnlocked.size) || document.querySelector(".save-btn:not(:disabled)")
      || document.querySelector("#wall-text, #ann-text")?.value || document.activeElement?.closest("#personForm");
    if (busy){ toast("A new version of the app is ready. It will load next time you open it."); return; }
    navigator.serviceWorker?.getRegistration().then(r => r && r.update()).catch(() => {});
    location.reload();
  } catch(e){}
}

document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible") checkForUpdate();
  if (document.visibilityState !== "visible" || S.phase !== "ready" || DEMO) return;
  try { S.announcements = await LiveAPI.announcements(); S.messages = await LiveAPI.messages(); if (S.view === "home" || S.view === "member") render(); } catch(e){}
  updateBadge();
});
